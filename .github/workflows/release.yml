name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CubeShelfLauncher.sln

      - name: Publish launcher
        run: dotnet publish src/CubeShelf.Launcher/CubeShelf.Launcher.csproj -c Release -r win-x64 --self-contained true -o publish/CubeShelf

      - name: Publish updater
        run: dotnet publish src/CubeShelf.Updater/CubeShelf.Updater.csproj -c Release -r win-x64 --self-contained true -o publish/Updater

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item publish/Updater/CubeShelf.Updater.exe publish/CubeShelf/
          Compress-Archive -Path publish/CubeShelf/* -DestinationPath CubeShelf-win-x64.zip -Force
          $hash = (Get-FileHash CubeShelf-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  CubeShelf-win-x64.zip" | Out-File checksums.txt -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CubeShelf-win-x64.zip
            checksums.txt
