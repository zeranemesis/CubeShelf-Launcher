name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write

concurrency:
  group: cubeshelf-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine next release version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag --list "v*"

          $versions = @()
          foreach ($tag in $tags) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $versions += [PSCustomObject]@{
                Tag = $tag
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
          }

          if ($versions.Count -eq 0) {
            $major = 0
            $minor = 6
            $patch = 10
          }
          else {
            $latest = $versions |
              Sort-Object Major, Minor, Patch |
              Select-Object -Last 1

            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch + 1
          }

          $version = "$major.$minor.$patch"
          $tag = "v$version"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Next CubeShelf release: $tag"

      - name: Restore
        run: dotnet restore CubeShelfLauncher.sln

      - name: Publish launcher
        run: >
          dotnet publish
          src/CubeShelf.Launcher/CubeShelf.Launcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/CubeShelf

      - name: Publish updater
        run: >
          dotnet publish
          src/CubeShelf.Updater/CubeShelf.Updater.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -o publish/Updater

      - name: Sign Windows executables (optional)
        shell: pwsh
        env:
          CUBESHELF_SIGN_PFX_BASE64: ${{ secrets.CUBESHELF_SIGN_PFX_BASE64 }}
          CUBESHELF_SIGN_PFX_PASSWORD: ${{ secrets.CUBESHELF_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CUBESHELF_SIGN_PFX_BASE64)) {
            Write-Host "No signing certificate configured; publishing unsigned binaries."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "cubeshelf-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:CUBESHELF_SIGN_PFX_BASE64))

          $signtool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found on the GitHub runner."
          }

          $targets = @(
            "publish/CubeShelf/CubeShelf.exe",
            "publish/Updater/CubeShelf.Updater.exe"
          )

          foreach ($target in $targets) {
            & $signtool.FullName sign `
              /f $pfx `
              /p $env:CUBESHELF_SIGN_PFX_PASSWORD `
              /fd SHA256 `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $target

            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for $target"
            }
          }

          Remove-Item $pfx -Force

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item `
            publish/Updater/CubeShelf.Updater.exe `
            publish/CubeShelf/CubeShelf.Updater.exe `
            -Force

          Compress-Archive `
            -Path publish/CubeShelf/* `
            -DestinationPath CubeShelf-win-x64.zip `
            -Force

          $hash = (
            Get-FileHash `
              CubeShelf-win-x64.zip `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  CubeShelf-win-x64.zip" |
            Out-File checksums.txt -Encoding ascii

      - name: Tag this commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            CubeShelf-win-x64.zip
            checksums.txt
